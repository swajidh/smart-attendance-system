# Production overrides — use with infra/docker/docker-compose.yml
#
#   docker compose -f infra/docker/docker-compose.yml \
#     -f infra/docker/docker-compose.production.yml \
#     --env-file infra/docker/.env up -d --build

services:
  backend:
    # One worker: each worker loads PyTorch/YOLO/MediaPipe separately (saves RAM).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL}
      SECRET_KEY: ${SECRET_KEY}
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@yourdomain.com}
      EXAM_PHONE_CONFIDENCE: ${EXAM_PHONE_CONFIDENCE:-0.30}

  migrate:
    environment:
      SECRET_KEY: ${SECRET_KEY}

  frontend:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        VITE_API_URL: /api/v1
