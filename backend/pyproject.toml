[tool.poetry]
name = "smart-attendance-backend"
version = "0.1.0"
description = "Backend scaffold for smart attendance demo"
authors = ["FYP Team"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "0.115.0"
uvicorn = "0.30.6"
sqlalchemy = "2.0.35"
aiosqlite = "0.20.0"
pydantic-settings = "2.5.2"
python-json-logger = "2.0.7"
alembic = "1.13.2"
python-multipart = "0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.3"
pytest-asyncio = "0.24.0"
httpx = "0.27.2"
ruff = "0.6.9"
mypy = "1.11.2"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
