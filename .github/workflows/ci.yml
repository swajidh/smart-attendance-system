name: CI — Smart Attendance System

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Backend lint ─────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install lint tools
        run: pip install flake8 black isort

      - name: flake8
        run: flake8 app/ --max-line-length=120 --exclude=__pycache__,alembic

      - name: black (check only)
        run: black --check --line-length=120 app/ tests/

      - name: isort (check only)
        run: isort --check-only --profile black app/ tests/

  # ── Backend tests ────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sas_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sas_test
      SECRET_KEY: ci-test-secret-key-not-for-production
      ALLOWED_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short --timeout=60

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/.pytest_cache/

  # ── Model integrity check (SA-06, SAM-03) ────────────────────────────────────
  model-integrity:
    name: ML Model Integrity
    runs-on: ubuntu-latest
    needs: backend-test
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ML dependencies
        run: pip install mediapipe>=0.10.9 numpy>=1.26.0 opencv-python-headless>=4.9.0

      - name: Check ML module imports
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          sys.path.insert(0, '..')
          try:
              from ml.head_pose import HEAD_POSE_READY
              print(f'head_pose module loaded. HEAD_POSE_READY={HEAD_POSE_READY}')
              if not HEAD_POSE_READY:
                  print('HEAD_POSE_READY is False — attention pipeline will be degraded')
          except Exception as e:
              print(f'head_pose import failed: {e}')
              sys.exit(1)
          try:
              from ml.attention_scorer import update, get_class_average
              print('attention_scorer module OK')
          except Exception as e:
              print(f'attention_scorer import failed: {e}')
              sys.exit(1)
          try:
              from ml.posture_detector import detect, clear_session
              print('posture_detector module OK')
          except Exception as e:
              print(f'posture_detector import failed: {e}')
              sys.exit(1)
          print('All ML modules verified.')
          "
        working-directory: .

  # ── Frontend lint ────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  # ── Frontend tests ────────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test -- --run

  # ── Docker build (smoke test) ────────────────────────────────────────────────
  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: sas-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/Dockerfile.frontend
          push: false
          tags: sas-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy (main branch only) ─────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/smart-attendance-system
            git pull origin main
            docker compose -f infra/docker/docker-compose.yml pull
            docker compose -f infra/docker/docker-compose.yml up -d --build migrate
            docker compose -f infra/docker/docker-compose.yml up -d --build backend frontend
            # Smoke test
            sleep 10
            curl -f http://localhost:8000/health || (echo "Deploy health check failed" && exit 1)
            echo "Deploy successful"
